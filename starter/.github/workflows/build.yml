name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone and shared jars
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: build/libs/*.jar
