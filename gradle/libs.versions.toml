[versions]
# Paper API baseline the framework compiles against (oldest supported release line).
paper = "1.21.1-R0.1-SNAPSHOT"
# Newer API used only on test classpaths (MockBukkit tracks the latest 1.21.x API).
paperTest = "1.21.11-R0.1-SNAPSHOT"
avaje = "12.7"
junit = "6.1.3"
assertj = "3.27.7"
mockbukkit = "4.116.3"
sqlite = "3.53.4.0"
hikari = "7.1.0"
mariadb = "3.5.10"
snakeyaml = "2.7"
jspecify = "1.0.1"
testcontainers = "2.0.5"
shadow = "9.6.1"
spotless = "8.10.4"
palantir = "2.102.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
paper-api-test = { module = "io.papermc.paper:paper-api", version.ref = "paperTest" }
avaje-inject = { module = "io.avaje:avaje-inject", version.ref = "avaje" }
avaje-inject-generator = { module = "io.avaje:avaje-inject-generator", version.ref = "avaje" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }
shadow-gradle = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
