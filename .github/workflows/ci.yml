name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v5
      # Formatting, processor tests, MockBukkit runtime tests, SQLite and (Docker is available here) MariaDB tests.
      - run: ./gradlew build
      - name: Check that builds are reproducible
        run: |
          sha256sum framework-plugin/build/libs/*.jar examples/*/build/libs/*.jar > first.sha256
          ./gradlew clean assemble --no-build-cache
          sha256sum -c first.sha256
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  starter:
    name: Starter template from published artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew publishAllToMavenLocal
      - run: ./gradlew build
        working-directory: starter

  paper:
    name: Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        paper: ['1.21.1', '1.21.4', '1.21.11', '26.1.2', '26.3']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the GUI test client
        run: npm ci
        working-directory: examples/dual-runtime-test/gui-bot
      - name: Build the starter for its scenarios
        run: |
          ./gradlew publishAllToMavenLocal
          (cd starter && ./gradlew build -x test)
      - name: Boot Paper and run every scenario
        run: ./gradlew :examples:dual-runtime-test:harness:paperTest -PpaperVersions=${{ matrix.paper }}
      - name: Report
        if: always()
        run: cat examples/dual-runtime-test/harness/build/paper-test-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: paper-${{ matrix.paper }}
          path: |
            examples/dual-runtime-test/harness/build/paper-test-report.md
            examples/dual-runtime-test/servers/${{ matrix.paper }}/*/logs/latest.log
          if-no-files-found: ignore
